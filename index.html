<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a4b12">
<title>Carta | Casa Blanca Pamplonita</title>
<meta name="description" content="Carta del restaurante Casa Blanca, Pamplonita, Norte de Santander.">
<style>
  :root{
    --cafe:#8a4b12; --cafe-osc:#5c3009; --crema:#fbf6ee; --papel:#fff;
    --linea:#e8dccb; --texto:#2b1d10; --suave:#7a6652; --dorado:#f3e3c7;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{font-family:Georgia,"Times New Roman",serif;background:var(--crema);color:var(--texto);
    overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}

  header{background:#f5f1e8;text-align:center;padding:10px 0 14px;border-bottom:3px solid var(--cafe)}
  .portada{width:min(68vw,280px);margin:0 auto 6px;display:block}
  .portada img{width:100%;height:auto;display:block;border-radius:0}
  .sobre{letter-spacing:.28em;font-size:.78rem;color:var(--cafe);font-weight:bold}
  h1{font-size:clamp(1.9rem,9vw,2.6rem);color:#000;letter-spacing:.06em;line-height:1.1}
  .lugar{font-size:.95rem;color:var(--suave);margin-top:4px}

  .aviso{display:flex;gap:12px;align-items:center;background:var(--cafe);color:#fff;
    margin:14px;padding:14px 16px;border-radius:14px;box-shadow:0 2px 6px rgba(90,50,10,.25)}
  .aviso .ico{font-size:2rem;line-height:1}
  .aviso p{font-size:1.02rem;line-height:1.35}
  .aviso b{display:block;font-size:1.12rem}

  nav{position:sticky;top:0;z-index:5;background:var(--crema);display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--linea)}
  nav button{flex:1;padding:12px 8px;border:2px solid var(--cafe);background:transparent;color:var(--cafe);
    font:bold 1.05rem Georgia,serif;border-radius:999px;cursor:pointer}
  nav button.on{background:var(--cafe);color:#fff}

  main{max-width:640px;margin:0 auto;padding:6px 14px 10px}
  h2{font-size:1.3rem;color:var(--cafe-osc);margin:20px 0 10px;border-bottom:2px solid var(--linea);padding-bottom:6px}

  .plato{background:var(--papel);border:1px solid var(--linea);border-radius:16px;margin-bottom:12px;overflow:hidden;
    display:flex;align-items:stretch;box-shadow:0 1px 3px rgba(90,50,10,.08)}
  .foto{flex:0 0 96px;min-height:96px;background:var(--dorado);display:flex;align-items:center;justify-content:center;
    font-size:2.8rem;position:relative}
  .foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .info{flex:1;min-width:0;padding:12px 14px}
  .info h3{font-size:1.08rem;line-height:1.2}
  .info p{font-size:.9rem;color:var(--suave);margin-top:4px;line-height:1.35}
  .precio{margin-top:8px;font-weight:bold;color:var(--cafe);font-size:1.12rem}

  .pie{max-width:640px;margin:8px auto 0;padding:0 14px}
  footer{text-align:center;color:var(--suave);font-size:.85rem;padding:18px 14px calc(24px + env(safe-area-inset-bottom))}

  @media (max-width:360px){ .foto{flex-basis:78px;font-size:2.2rem} .aviso{margin:12px 10px} }
</style>
</head>

  <div class="sobre">HOSPEDAJE</div>
  <h1>CASA BLANCA</h1>
  <div class="lugar">Pamplonita · Norte de Santander</div>
</header>

<div class="aviso" role="note">
  <div class="ico">🛎️</div>
  <p><b>¿Ya decidiste?</b>Llama a un mesero para que tome tu orden.</p>
</div>

<nav>
  <button class="on" data-cat="platos">🍽️ Platos</button>
  <button data-cat="bebidas">🥤 Bebidas</button>
</nav>

<main id="carta"></main>

<div class="pie">
  <div class="aviso" role="note">
    <div class="ico">🛎️</div>
    <p><b>¿Listo para ordenar?</b>Avísale a un mesero y con gusto tomará tu pedido.</p>
  </div>
</div>

<footer>Precios en pesos colombianos (COP) · ¡Buen provecho!</footer>

<script>
/* Fotos opcionales: sube una imagen a la carpeta "fotos" con el id del producto
   (por ejemplo fotos/mute.jpg, fotos/picada.jpg). Si no existe, se muestra el ícono. */
const MENU = {
  platos: [
    { t: "Platos fuertes", items: [
      { id:"mute", e:"🍲", n:"Mute", d:"Incluye arroz y aguacate.", p:12000 },
      { id:"picada", e:"🍖", n:"Picada", d:"Carne, pechuga, chinchuya, papas a la francesa, chimichurri y piña asada.", p:30000 },
      { id:"pechuga", e:"🍗", n:"Pechuga asada", d:"Pechuga con piña asada, papas a la francesa, aderezo y salsa tártara.", p:25000 },
      { id:"churrasco", e:"🥩", n:"Churrasco completo", d:"300 gr.", p:45000 },
      { id:"medio", e:"🥩", n:"Medio churrasco", d:"150 gr.", p:25000 }
    ]}
  ],
  bebidas: [
    { t: "Gaseosas y agua", items: [
      { id:"coca-p", e:"🥤", n:"Coca-Cola personal", d:"", p:2500 },
      { id:"coca-15", e:"🥤", n:"Coca-Cola 1,5 L", d:"", p:9000 },
      { id:"quatro", e:"🧃", n:"Quatro mini", d:"237 ml.", p:2000 },
      { id:"brisa-1", e:"💧", n:"Agua Brisa 1 L", d:"", p:4000 },
      { id:"brisa-p", e:"💧", n:"Agua Brisa personal", d:"", p:2500 }
    ]},
    { t: "Cervezas", items: [
      { id:"coronita", e:"🍺", n:"Cerveza Coronita", d:"", p:5000 },
      { id:"poker", e:"🍺", n:"Cerveza Poker", d:"", p:9000 }
    ]}
  ]
};

const cop = n => "$" + n.toLocaleString("es-CO");
let cat = "platos";

function pintar(){
  document.getElementById("carta").innerHTML = MENU[cat].map(g => `
    <h2>${g.t}</h2>` + g.items.map(i => `
    <div class="plato">
      <div class="foto">${i.e}<img src="fotos/${i.id}.jpg" alt="${i.n}" loading="lazy" onerror="this.remove()"></div>
      <div class="info">
        <h3>${i.n}</h3>
        ${i.d ? `<p>${i.d}</p>` : ""}
        <div class="precio">${cop(i.p)}</div>
      </div>
    </div>`).join("")).join("");
}

document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  cat = b.dataset.cat;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  pintar();
  window.scrollTo({top:0,behavior:"smooth"});
});

pintar();
</script>
